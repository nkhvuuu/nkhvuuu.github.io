<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Dodendi admin</title>
<style>
:root{--red:#cf2534;--ink:#141413;--mute:#6b6b68;--line:#e6e3df;--bg:#faf9f7}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:.04em}
main{max-width:860px;margin:0 auto;padding:16px}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;color:var(--ink)}
button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
button.danger{color:var(--red)}button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:76px}label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.row img,.row .noimg{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#eee;flex:none}
.row .t{flex:1;min-width:0}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t small{color:var(--mute)}
.sold{background:var(--red);color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.photos{display:flex;gap:8px;flex-wrap:wrap}.ph{position:relative;width:96px;height:96px}.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.ph button{position:absolute;top:2px;right:2px;padding:0 7px;border-radius:99px;background:#fff}.ph i{position:absolute;left:4px;bottom:4px;background:#000a;color:#fff;font-size:11px;font-style:normal;padding:0 6px;border-radius:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.msg{padding:10px 14px;border-radius:8px;margin:10px 0;background:#fff;border:1px solid var(--line)}.msg.err{border-color:var(--red);color:var(--red)}
.check{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:16px;color:var(--ink)}.check input{width:22px;height:22px}
.bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.hide{display:none!important}
</style></head><body>
<header><h1>DODENDI <span id="hSub" style="font-weight:400;color:var(--mute)">admin</span></h1><button id="lang">Tiếng Việt</button><button id="out" class="hide"></button></header>
<main id="app"></main>
<script>
(function () {
"use strict";
var CLOUD = { url: "https://vqtqtlcpbuybtufxcszx.supabase.co", key: "sb_publishable_2jynrHIPVunzJlK5nhlR3g_tYy2UWXs" };
var CATS = ["shoes", "eyewear", "watches", "jewellery", "bags", "clothing", "accessories"];
var KINDS = { shoes: ["heels", "flats", "mules", "boots", "maryjanes", "sneakers", "sandals"], eyewear: ["sunglasses", "frames"], watches: [], jewellery: ["necklaces", "earrings", "rings", "bracelets", "brooches"], bags: ["handbags", "crossbody", "wallets"], clothing: ["tops", "dresses", "skirts", "outerwear"], accessories: ["hair", "belts", "other"] };
var GRADES = ["10", "9.5", "9", "8.5", "8", "7"];
var T = {
  en: { admin: "admin", email: "Email", pass: "Password", login: "Sign in", logout: "Sign out", bad: "Wrong email or password.", notAdmin: "This account can't edit the shop. Ask Vu to add your email.",
    products: "Pieces", posts: "Instagram posts", add: "Add a piece", empty: "Nothing here yet.", sold: "Sold", edit: "Edit", save: "Save", cancel: "Cancel", del: "Delete", sure: "Delete this for good?",
    photos: "Photos (the first one is the cover, up to 4)", addPhoto: "Add photos", name: "Name", brand: "Brand", cat: "Category", kind: "Type (optional)", price: "Price in VND (empty = ask for price)", size: "Size (shoes: 37, 37.5, 38)", grade: "Condition (out of 10)", isSold: "Sold", noteEn: "Description in English", noteVi: "Description in Vietnamese",
    needName: "Please type a name.", saved: "Saved.", saving: "Saving…", line: "Which running line", lineVw: "Vivienne Westwood", lineAs: "Anna Sui", link: "Instagram post link", caption: "Caption (optional)", date: "Date (optional)", addPost: "Add a post", cover: "cover",
    imp: "Import the 47 pieces from the website", impHelp: "One-time: copies the pieces and posts that are on the website into this shop, with their photos.", impDone: "Done: imported {p} pieces and {f} posts.", impNone: "Couldn't read the website's pieces.", uploading: "Uploading photos…", fail: "Something went wrong: ", askPrice: "Ask for price" },
  vi: { admin: "quản lý", email: "Email", pass: "Mật khẩu", login: "Đăng nhập", logout: "Đăng xuất", bad: "Sai email hoặc mật khẩu.", notAdmin: "Tài khoản này chưa được sửa shop. Nhờ Vu thêm email của bạn.",
    products: "Sản phẩm", posts: "Bài Instagram", add: "Thêm sản phẩm", empty: "Chưa có gì.", sold: "Đã bán", edit: "Sửa", save: "Lưu", cancel: "Hủy", del: "Xóa", sure: "Xóa hẳn mục này?",
    photos: "Ảnh (ảnh đầu là ảnh bìa, tối đa 4)", addPhoto: "Thêm ảnh", name: "Tên", brand: "Hãng", cat: "Loại", kind: "Kiểu (không bắt buộc)", price: "Giá (VND, để trống = hỏi giá)", size: "Size (giày: 37, 37.5, 38)", grade: "Tình trạng (trên 10)", isSold: "Đã bán", noteEn: "Mô tả tiếng Anh", noteVi: "Mô tả tiếng Việt",
    needName: "Bạn nhập tên nhé.", saved: "Đã lưu.", saving: "Đang lưu…", line: "Hàng chạy nào", lineVw: "Vivienne Westwood", lineAs: "Anna Sui", link: "Link bài Instagram", caption: "Chú thích (không bắt buộc)", date: "Ngày (không bắt buộc)", addPost: "Thêm bài", cover: "bìa",
    imp: "Nhập 47 sản phẩm từ website", impHelp: "Làm một lần: chép các sản phẩm và bài đang có trên website vào shop này, kèm ảnh.", impDone: "Xong: đã nhập {p} sản phẩm và {f} bài.", impNone: "Không đọc được sản phẩm của website.", uploading: "Đang tải ảnh…", fail: "Có lỗi: ", askPrice: "Hỏi giá" }
};
var lang = "en"; try { lang = localStorage.getItem("dd-admin-lang") || (/^vi/i.test(navigator.language) ? "vi" : "en"); } catch (e) {}
function t(k, v) { var s = (T[lang][k] != null ? T[lang][k] : T.en[k]) || k; if (v) Object.keys(v).forEach(function (n) { s = s.replace("{" + n + "}", v[n]); }); return s; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
var $ = function (s) { return document.querySelector(s); };

/* ---------- plain REST calls to Supabase ---------- */
var session = null;
try { session = JSON.parse(localStorage.getItem("dd-admin-session") || "null"); } catch (e) {}
function saveSession(s) { session = s; try { if (s) localStorage.setItem("dd-admin-session", JSON.stringify(s)); else localStorage.removeItem("dd-admin-session"); } catch (e) {} }
function tokenCall(body, grant) {
  return fetch(CLOUD.url + "/auth/v1/token?grant_type=" + grant, { method: "POST", headers: { apikey: CLOUD.key, "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || r.status); saveSession({ access: j.access_token, refresh: j.refresh_token, email: (j.user && j.user.email) || (session && session.email) || "" }); }); });
}
function api(path, opts, retry) {
  opts = opts || {};
  var h = Object.assign({ apikey: CLOUD.key }, session ? { Authorization: "Bearer " + session.access } : {}, opts.headers || {});
  return fetch(CLOUD.url + path, { method: opts.method || "GET", headers: h, body: opts.body }).then(function (r) {
    if (r.status === 401 && session && !retry) return tokenCall({ refresh_token: session.refresh }, "refresh_token").then(function () { return api(path, opts, true); });
    if (!r.ok) return r.text().then(function (x) { throw new Error(x || r.status); });
    return r.status === 204 ? null : r.text().then(function (x) { return x ? JSON.parse(x) : null; });
  });
}
var rest = {
  list: function (table) { return api("/rest/v1/" + table + "?select=*&order=" + (table === "products" ? "updated_at.desc" : "id.desc")); },
  upsert: function (id, data) { return api("/rest/v1/products?on_conflict=id", { method: "POST", headers: { "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify({ id: id, data: data, updated_at: new Date().toISOString() }) }); },
  addPost: function (data) { return api("/rest/v1/posts", { method: "POST", headers: { "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify({ data: data }) }); },
  del: function (table, id) { return api("/rest/v1/" + table + "?id=eq." + encodeURIComponent(id), { method: "DELETE" }); }
};
function uploadBlob(blob) {
  var type = /^image\/(jpeg|png|webp)$/.test(blob.type) ? blob.type : "image/jpeg", path = "p/" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + "." + type.slice(6).replace("jpeg", "jpg");
  return api("/storage/v1/object/photos/" + path, { method: "POST", headers: { "Content-Type": type, "x-upsert": "true" }, body: blob }).then(function () { return CLOUD.url + "/storage/v1/object/public/photos/" + path; });
}
/* photos are shrunk to 900 px and re-saved as JPEG, which also drops location data */
function shrink(file) {
  return new Promise(function (res, rej) {
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      var k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? res(b) : rej(new Error("photo")); }, "image/jpeg", 0.84);
    };
    im.onerror = function () { rej(new Error("Couldn't read that photo (try a JPG or PNG).")); }; im.src = url;
  });
}

/* ---------- screens ---------- */
var view = "products", st = { products: [], posts: [], draft: null, msg: "", err: false, busy: false };
function say(m, err) { st.msg = m; st.err = !!err; }
function render() {
  $("#hSub").textContent = t("admin"); $("#lang").textContent = lang === "en" ? "Tiếng Việt" : "English";
  $("#out").classList.toggle("hide", !session); $("#out").textContent = t("logout");
  if (!session) return renderLogin();
  var h = '<div class="tabs"><button data-v="products" aria-pressed="' + (view === "products") + '">' + t("products") + '</button><button data-v="posts" aria-pressed="' + (view === "posts") + '">' + t("posts") + "</button></div>";
  if (st.msg) h += '<div class="msg' + (st.err ? " err" : "") + '">' + esc(st.msg) + "</div>";
  if (st.draft) h += view === "products" ? productForm() : postForm();
  else h += view === "products" ? productList() : postList();
  $("#app").innerHTML = h;
}
function renderLogin() {
  $("#app").innerHTML = '<form class="card" id="login" style="max-width:380px;margin:40px auto"><label>' + t("email") + '</label><input name="e" type="email" autocomplete="username" required><label>' + t("pass") + '</label><input name="p" type="password" autocomplete="current-password" required>' +
    (st.msg ? '<div class="msg err">' + esc(st.msg) + "</div>" : "") + '<div class="bar"><button class="pri" style="width:100%">' + t("login") + "</button></div></form>";
}
function fmtPrice(p) { return p && +p > 0 ? "₫" + Math.round(+p).toLocaleString("en-US") : t("askPrice"); }
function productList() {
  var h = '<div class="bar" style="margin-top:0"><button class="pri" data-a="new">+ ' + t("add") + "</button></div><p></p>";
  if (!st.products.length) h += '<div class="card"><p>' + t("empty") + '</p><p style="color:var(--mute)">' + t("impHelp") + '</p><button data-a="import">' + t("imp") + "</button></div>";
  st.products.forEach(function (r) {
    var p = r.data, im = p.img && p.img[0];
    h += '<div class="row">' + (im ? '<img src="' + esc(im) + '" alt="">' : '<span class="noimg"></span>') + '<div class="t"><b>' + esc(p.name) + (p.sold ? '<span class="sold">' + t("sold") + "</span>" : "") + "</b><small>" + esc(p.brand || "") + " · " + fmtPrice(p.price) + (p.size ? " · " + esc(p.size) : "") + '</small></div><button data-a="sold" data-id="' + esc(r.id) + '">' + (p.sold ? "↩" : "✓ " + t("sold")) + '</button><button data-a="edit" data-id="' + esc(r.id) + '">' + t("edit") + "</button></div>";
  });
  return h;
}
function opts(list, cur, none) { return (none ? '<option value="">' + none + "</option>" : "") + list.map(function (x) { return '<option' + (x === cur ? " selected" : "") + ">" + esc(x) + "</option>"; }).join(""); }
function photoBox(imgs) {
  return '<label>' + t("photos") + '</label><div class="photos">' + imgs.map(function (u, i) { return '<div class="ph"><img src="' + esc(u) + '" alt=""><button type="button" data-a="rmphoto" data-i="' + i + '">×</button>' + (i === 0 ? "<i>" + t("cover") + "</i>" : "") + "</div>"; }).join("") + "</div>" +
    (imgs.length < 4 ? '<div class="bar" style="margin-top:8px"><label class="btn" style="margin:0;color:var(--ink);font-size:16px">' + t("addPhoto") + '<input type="file" id="files" accept="image/*" multiple style="display:none"></label></div>' : "");
}
function productForm() {
  var d = st.draft;
  return '<form class="card" id="pform">' + photoBox(d.img) +
    '<label>' + t("name") + '</label><input name="name" value="' + esc(d.name) + '">' +
    '<div class="grid2"><div><label>' + t("brand") + '</label><input name="brand" value="' + esc(d.brand) + '"></div><div><label>' + t("cat") + '</label><select name="cat">' + opts(CATS, d.cat) + "</select></div>" +
    '<div><label>' + t("kind") + '</label><select name="kind">' + opts(KINDS[d.cat] || [], d.kind, "—") + '</select></div><div><label>' + t("grade") + '</label><select name="grade">' + opts(GRADES, d.grade) + "</select></div>" +
    '<div><label>' + t("price") + '</label><input name="price" inputmode="numeric" value="' + esc(d.price || "") + '"></div><div><label>' + t("size") + '</label><input name="size" value="' + esc(d.size) + '"></div></div>' +
    '<label>' + t("noteEn") + '</label><textarea name="note_en">' + esc(d.note_en) + '</textarea><label>' + t("noteVi") + '</label><textarea name="note_vi">' + esc(d.note_vi) + "</textarea>" +
    '<label class="check"><input type="checkbox" name="sold"' + (d.sold ? " checked" : "") + "> " + t("isSold") + "</label>" +
    '<div class="bar"><button class="pri"' + (st.busy ? " disabled" : "") + ">" + t("save") + '</button><button type="button" data-a="cancel">' + t("cancel") + "</button>" + (d.exists ? '<button type="button" class="danger" data-a="delete" style="margin-left:auto">' + t("del") + "</button>" : "") + "</div></form>";
}
function postList() {
  var h = '<div class="bar" style="margin-top:0"><button class="pri" data-a="newpost">+ ' + t("addPost") + "</button></div><p></p>";
  if (!st.posts.length) h += '<div class="card"><p>' + t("empty") + "</p></div>";
  st.posts.forEach(function (r) {
    var p = r.data;
    h += '<div class="row">' + (p.imgs && p.imgs[0] ? '<img src="' + esc(p.imgs[0]) + '" alt="">' : '<span class="noimg"></span>') + '<div class="t"><b>' + esc((p.caption || p.url || "").split("\n")[0]) + "</b><small>" + (p.line === "as" ? t("lineAs") : t("lineVw")) + " · " + esc(p.date || "") + '</small></div><button class="danger" data-a="delpost" data-id="' + r.id + '">' + t("del") + "</button></div>";
  });
  return h;
}
function postForm() {
  var d = st.draft;
  return '<form class="card" id="qform">' + photoBox(d.imgs) + '<label>' + t("line") + '</label><select name="line"><option value="vw"' + (d.line === "vw" ? " selected" : "") + ">" + t("lineVw") + '</option><option value="as"' + (d.line === "as" ? " selected" : "") + ">" + t("lineAs") + "</option></select>" +
    '<label>' + t("link") + '</label><input name="url" value="' + esc(d.url) + '" placeholder="https://www.instagram.com/p/…"><label>' + t("caption") + '</label><textarea name="caption">' + esc(d.caption) + '</textarea><label>' + t("date") + '</label><input name="date" type="date" value="' + esc(d.date) + '">' +
    '<div class="bar"><button class="pri"' + (st.busy ? " disabled" : "") + ">" + t("save") + '</button><button type="button" data-a="cancel">' + t("cancel") + "</button></div></form>";
}
function blankProduct() { return { img: [], name: "", brand: "", cat: "shoes", kind: "", grade: "9", price: "", size: "", note_en: "", note_vi: "", sold: false, exists: false }; }
function readForm(f, d) {
  var fd = new FormData(f);
  ["name", "brand", "cat", "kind", "grade", "price", "size", "note_en", "note_vi", "url", "caption", "date", "line"].forEach(function (k) { if (fd.has(k)) d[k] = String(fd.get(k)).trim(); });
  if (f.id === "pform") d.sold = !!fd.get("sold");
}
function checkAdmin() {
  return api("/rest/v1/rpc/is_admin", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }).then(function (ok) { if (ok !== true) throw new Error("not admin"); });
}
function load() {
  return Promise.all([rest.list("products"), rest.list("posts")]).then(function (r) { st.products = r[0]; st.posts = r[1]; render(); });
}
function guard(p) { st.busy = true; return p.then(function (x) { st.busy = false; return x; }, function (e) { st.busy = false; say(t("fail") + (e.message || e), true); render(); throw e; }); }

document.addEventListener("click", function (ev) {
  var b = ev.target.closest("button"); if (!b) return;
  if (b.id === "lang") { lang = lang === "en" ? "vi" : "en"; try { localStorage.setItem("dd-admin-lang", lang); } catch (e) {} return render(); }
  if (b.id === "out") { saveSession(null); st.msg = ""; return render(); }
  if (b.dataset.v) { view = b.dataset.v; st.draft = null; st.msg = ""; return render(); }
  var a = b.dataset.a; if (!a) return;
  var id = b.dataset.id, form = document.querySelector("#pform,#qform");
  if (form && st.draft) readForm(form, st.draft);
  if (a === "new") { st.draft = blankProduct(); st.msg = ""; return render(); }
  if (a === "newpost") { st.draft = { imgs: [], line: "vw", url: "", caption: "", date: "" }; st.msg = ""; return render(); }
  if (a === "cancel") { st.draft = null; return render(); }
  if (a === "rmphoto") { (st.draft.img || st.draft.imgs).splice(+b.dataset.i, 1); return render(); }
  if (a === "edit") { var r = st.products.filter(function (x) { return x.id === id; })[0]; st.draft = Object.assign(blankProduct(), r.data, { id: id, exists: true, price: r.data.price || "", size: r.data.size || "", note_en: r.data.note_en || "", note_vi: r.data.note_vi || "" }); st.msg = ""; return render(); }
  if (a === "sold") { var q = st.products.filter(function (x) { return x.id === id; })[0]; var nd = Object.assign({}, q.data, { sold: !q.data.sold }); return guard(rest.upsert(id, nd)).then(load); }
  if (a === "delete") { if (!confirm(t("sure"))) return; return guard(rest.del("products", st.draft.id)).then(function () { st.draft = null; say(""); return load(); }); }
  if (a === "delpost") { if (!confirm(t("sure"))) return; return guard(rest.del("posts", id)).then(load); }
  if (a === "import") return doImport();
});
document.addEventListener("change", function (ev) {
  var el = ev.target;
  if (el.id === "files") {
    var d = st.draft, list = d.img || d.imgs, files = Array.prototype.slice.call(el.files, 0, 4 - list.length), f = document.querySelector("#pform,#qform");
    if (f) readForm(f, d);
    say(t("uploading")); render();
    return guard(files.reduce(function (p, file) { return p.then(function () { return shrink(file).then(uploadBlob).then(function (u) { list.push(u); }); }); }, Promise.resolve())).then(function () { say(""); render(); });
  }
  if (el.name === "cat" && st.draft) { readForm(el.form, st.draft); st.draft.kind = ""; render(); }
});
document.addEventListener("submit", function (ev) {
  ev.preventDefault();
  var f = ev.target;
  if (f.id === "login") {
    var fd = new FormData(f); st.msg = "";
    return tokenCall({ email: String(fd.get("e")).trim(), password: String(fd.get("p")) }, "password").then(function () { return checkAdmin().then(null, function (e) { saveSession(null); throw new Error("denied"); }); }).then(function () { return load(); }).then(null, function (e) {
      saveSession(null); st.msg = e.message === "denied" ? t("notAdmin") : t("bad"); render();
    });
  }
  var d = st.draft; readForm(f, d);
  if (f.id === "pform") {
    if (!d.name) { say(t("needName"), true); return render(); }
    var id = d.id || ("p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5));
    var rec = { id: id, name: d.name, brand: d.brand, cat: d.cat, kind: d.kind || "", type: "stock", price: parseInt(String(d.price).replace(/\D/g, ""), 10) || 0, size: d.size, grade: d.grade, sold: d.sold, added: d.added || new Date().toISOString().slice(0, 10), note_en: d.note_en, note_vi: d.note_vi, img: d.img };
    if (d.ig) rec.ig = d.ig;
    return guard(rest.upsert(id, rec)).then(function () { st.draft = null; say(t("saved")); return load(); });
  }
  var post = { imgs: d.imgs, url: d.url, line: d.line, caption: d.caption || undefined, date: d.date || undefined };
  return guard(rest.addPost(post)).then(function () { st.draft = null; say(t("saved")); return load(); });
});

/* one-time import of the pieces and posts baked into the public page (their photos go to storage) */
function dataToUrl(u) {
  if (!/^data:image\//.test(u)) return Promise.resolve(u);
  return fetch(u).then(function (r) { return r.blob(); }).then(uploadBlob);
}
function doImport() {
  say(t("uploading")); render();
  return guard(fetch("./index.html", { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
    var m = /<script type="application\/json" id="dd-state">([\s\S]*?)<\/script>/.exec(html);
    if (!m) throw new Error(t("impNone"));
    var s = JSON.parse(m[1].replace(/\\u003c/g, "<")), prods = (s.products || []).filter(function (p) { return !p.sample; }), feed = (s.feed || []).slice().reverse(), done = { p: 0, f: 0 };
    if (!prods.length) throw new Error(t("impNone"));
    return prods.reduce(function (p, prod) {
      return p.then(function () {
        return Promise.all((prod.img || []).map(dataToUrl)).then(function (urls) { var rec = Object.assign({}, prod, { img: urls }); return rest.upsert(rec.id, rec); }).then(function () { done.p++; say(t("uploading") + " " + done.p + "/" + prods.length); render(); });
      });
    }, Promise.resolve()).then(function () {
      return feed.reduce(function (p, post) {
        return p.then(function () { return Promise.all((post.imgs || (post.img ? [post.img] : [])).map(dataToUrl)).then(function (urls) { return rest.addPost(Object.assign({}, post, { imgs: urls, img: undefined })); }).then(function () { done.f++; }); });
      }, Promise.resolve()).then(function () { return done; });
    });
  })).then(function (done) { say(t("impDone", done)); return load(); });
}

render();
if (session) checkAdmin().then(load).then(null, function () { saveSession(null); st.msg = t("notAdmin"); render(); });
})();
</script></body></html>
